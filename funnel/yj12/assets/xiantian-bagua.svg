<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic Earlier Heaven Bagua</title>
  <desc id="desc">Eight trigrams in the Earlier Heaven arrangement surrounding a Taiji symbol</desc>
  <defs>
