<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Monthly Payouts</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/affiliate-portal.css"></head><body>
<header class="qy-portal-header"><a href="/" class="qy-brand-lockup"><img src="/images/quantum-yijing-3d-logo.png" class="qy-brand-logo"><span class="qy-brand-name">Quantum YiJing®</span></a><div class="qy-portal-header-right"><div class="qy-portal-section">Affiliate Payout Admin</div><a href="/admin-affiliates.html" class="portal-outline-link">← Affiliate Admin</a></div></header>
<main class="portal-main"><h1>Affiliate Monthly Payout & Reconciliation</h1><section class="panel"><label>Admin Token<input id="token" type="password"></label><label>Affiliate ID<input id="affiliateId" type="number"></label><label>Payout Month<input id="period" type="month"></label><button id="load">Load Eligible Commissions</button><p id="status"></p></section>
<section class="panel"><h2>Eligible Commissions</h2><div id="summary"></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Product</th><th>Sale</th><th>Rate</th><th>Commission</th><th>Status</th></tr></thead><tbody id="eligible"></tbody></table></div><button id="create">Create Draft Payout</button></section>
<section class="panel"><h2>Payout Batches</h2><div class="table-wrap"><table><thead><tr><th>Ref</th><th>Affiliate</th><th>Period</th><th>Sales</th><th>Commission</th><th>Status</th><th>Payment Date</th><th>Payment Ref</th><th>Action</th></tr></thead><tbody id="payouts"></tbody></table></div></section>
<section class="panel"><h2>Record Bank Transfer</h2><label>Payout ID<input id="payPayout" type="number"></label><label>Payment Date<input id="paymentDate" type="date"></label><label>Payment Reference<input id="paymentRef"></label><button id="markPaid">Mark Paid</button></section></main><script src="/admin-affiliate-payouts.js" defer></script></body></html>
