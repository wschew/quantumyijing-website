<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum YiJing® Affiliate Login</title>
<link rel="stylesheet" href="/affiliate-portal.css">
</head><body>
<header class="portal-header"><a href="/" class="brand">Quantum YiJing®</a><div><button class="lang active" data-lang="en">EN</button><button class="lang" data-lang="zh">中文</button></div></header>
<main class="auth-wrap">
<section class="auth-card">
<p class="eyebrow" data-i18n="eyebrow">Affiliate Portal</p>
<h1 data-i18n="title">Affiliate Login</h1>
<p class="muted" data-i18n="intro">Sign in to view your sales, commissions, payout history and affiliate links.</p>
<label><span data-i18n="email">Email</span><input id="email" type="email" autocomplete="email"></label>
<label><span data-i18n="password">Password</span><input id="password" type="password" autocomplete="current-password"></label>
<button id="login" class="primary" data-i18n="login">Sign In</button>
<p id="status" class="status" aria-live="polite"></p>
<p><a href="/affiliate-forgot.html" data-i18n="forgot">Forgot password?</a></p>
</section>
</main>
<script src="/affiliate-login.js" defer></script>
</body></html>
