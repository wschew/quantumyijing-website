<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Portal Login | Quantum YiJing®</title><style>body{margin:0;background:#f4f8fc;font-family:Arial;color:#132842}.box{max-width:470px;margin:90px auto;background:white;padding:34px;border:1px solid #d7e2ef;border-radius:20px}img{width:70px}h1{color:#0b67c6}label{display:block;margin:15px 0;font-weight:800;color:#0b67c6}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #c9d7e8;border-radius:10px;margin-top:7px}button{width:100%;padding:13px;background:#0b67c6;color:white;border:0;border-radius:10px;font-weight:800}.msg{margin-top:15px;color:#b42318}</style></head><body><div class="box"><img src="/images/quantum-yijing-3d-logo.png"><h1>Coach Portal</h1><p>Quantum YiJing® private coach access</p><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login">Login</button><div id="msg" class="msg"></div></div><script>document.querySelector('#login').onclick=async()=>{const r=await fetch('/api/coach/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=d.error||'Login failed';return}localStorage.setItem('qy_coach_token',d.token);location.href='/coach-portal'};</script></body></html>
