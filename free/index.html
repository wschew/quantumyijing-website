<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Free Resource | Quantum YiJing</title>

  <script>
    (() => {
      const incoming = new URLSearchParams(window.location.search);

      const offer =
        (incoming.get('offer') || 'yijing-bagua-yinyang-cn')
          .trim()
          .replace(/[^a-zA-Z0-9_-]/g, '')
          .slice(0, 80) || 'yijing-bagua-yinyang-cn';

      const target = new URLSearchParams();

      target.set('offer', offer);

      target.set(
        'lang',
        incoming.get('lang') || 'zh'
      );

      target.set(
        'utm_source',
        incoming.get('utm_source') || 'whatsapp-channel'
      );

      target.set(
        'utm_medium',
        incoming.get('utm_medium') || 'organic'
      );

      target.set(
        'utm_campaign',
        incoming.get('utm_campaign') || 'lead-magnet'
      );

      const optional = [
        'utm_content',
        'utm_term',
        'aff',
        'affiliate',
        'lang'
      ];

      for (const key of optional) {
        const value = incoming.get(key);

        if (value) {
          target.set(key, value);
        }
      }

      window.location.replace('/lead/?' + target.toString());
    })();
  </script>

  <noscript>
    <meta
      http-equiv="refresh"
      content="0;url=/lead/?offer=yijing-bagua-yinyang-cn&amp;utm_source=whatsapp-channel&amp;utm_medium=organic&amp;utm_campaign=lead-magnet&amp;lang=zh"
    >
  </noscript>
</head>

<body>
  <p>
    Redirecting to the free resource…
   <a href="/lead/?offer=yijing-bagua-yinyang-cn&amp;utm_source=whatsapp-channel&amp;utm_medium=organic&amp;utm_campaign=lead-magnet&amp;lang=zh">
      Continue
    </a>
  </p>
</body>
</html>
