<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Academy Operating System | Quantum YiJing International Academy</title>
  <link rel="icon" href="images/quantum-yijing-logo.png">
  <link rel="stylesheet" href="admin.css?v=3.1.1">
</head>
<body>
  <main class="crm-shell">
    <section id="loginPanel" class="login-panel">
      <img src="images/quantum-yijing-3d-logo.png" alt="Quantum YiJing" class="login-logo">
      <p class="eyebrow">PRIVATE ADMINISTRATION</p>
      <h1>Academy Operating System</h1>
      <p class="login-copy">Secure CRM, marketing attribution, follow-up and student lifecycle management.</p>
      <form id="loginForm" class="login-form">
        <label for="adminToken">Administrator token</label>
        <input id="adminToken" type="password" autocomplete="current-password" required>
        <button type="submit">Open Dashboard</button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboard" class="dashboard" hidden>
      <header class="topbar">
        
        <label>Settlement / payment date<input id="paymentSettlementDate" type="date"></label>
        <label>Customer receipt issuer<select id="paymentReceiptIssuer"><option>Quantum YiJing</option><option>External Platform</option><option>Not Applicable</option></select></label>
      </div>
      <label>Accounting notes<textarea id="paymentNotes" rows="3" maxlength="1000" placeholder="e.g. Google payout after platform fee; bank transfer verified against statement."></textarea></label>
      
      <p id="paymentDialogMessage" class="form-message" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="admin.js?v=3.3.15j" defer></script>
</body>
</html>
