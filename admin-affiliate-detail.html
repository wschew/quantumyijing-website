<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QY Affiliate Detail</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin-affiliate-detail.css"></head>
<body>
<header class="affiliate-detail-header">
  <a href="/" class="qy-brand-lockup" aria-label="Quantum YiJing Home">
  <img src="/images/quantum-yijing-3d-logo.png" alt="Quantum YiJing® Logo" class="qy-brand-logo">
  <span class="qy-brand-name">Quantum YiJing®</span>
</a>
  <div class="affiliate-detail-header-right">
    <span class="affiliate-detail-section">Affiliate Detail</span>
    <a href="/admin-affiliates.html">← Affiliate Admin</a>
  </div>
</header>
<main>
<section class="toolbar">
  <label>Admin Token<input id="token" type="password"></label>
  <label>Find Affiliate<input id="affiliateSearch" placeholder="Name, code, email or ID"></label>
  <button id="searchBtn">Search</button>
  <label>Affiliate<select id="affiliateSelect"><option value="">Select affiliate…</option></select></label>
  <button id="load">Load Affiliate</button>
</section>
<p id="status"></p>
<section id="profile" class="hidden"></section>
<section id="summary" class="summary hidden"></section>
<section id="attrPanel" class="panel hidden"><h2>Customer Attributions</h2><div class="scroll"><table><thead><tr><th>Customer</th><th>Email</th><th>First Order</th><th>Started</th><th>Expires</th><th>Status</th></tr></thead><tbody id="attrs"></tbody></table></div></section>
<section id="commPanel" class="panel hidden"><h2>Commission Ledger</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Product</th><th>Sale</th><th>Rate</th><th>Commission</th><th>Status</th><th>Paid Date</th></tr></thead><tbody id="comms"></tbody></table></div></section>
<section id="payPanel" class="panel hidden"><h2>Monthly Payouts</h2><div class="scroll"><table><thead><tr><th>Period</th><th>Reference</th><th>Sales</th><th>Commission</th><th>Status</th><th>Payment Date</th><th>Payment Ref</th><th>Action</th></tr></thead><tbody id="pays"></tbody></table></div></section>
</main>
<script src="/admin-affiliate-detail.js" defer></script>
</body></html>
